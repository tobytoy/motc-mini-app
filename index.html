<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>周邊交通即時資訊助手 | motc-mini-dog</title>
    <!-- Anti-flash theme initialization from Cookie / LocalStorage -->
    <script>
      (function() {
        try {
          var cookieMatch = document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);
          var saved = cookieMatch ? cookieMatch[1] : localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- App CSS -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-top">
          <div class="brand">
            <span class="brand-icon">🚦</span>
            <div class="brand-text">
              <h1 class="brand-title">交通即時資訊助手</h1>
              <span class="brand-sub">LINE Mini App • TDX 即時聯網</span>
            </div>
          </div>
          <div class="header-actions">
            <button id="themeToggleBtn" class="theme-toggle-btn" title="切換深淺色模式" aria-label="切換深淺色模式">
              <span id="themeIcon">🌙</span>
            </button>
            <div id="userBadge" class="user-badge">
              <div class="avatar-placeholder" id="userAvatar">👤</div>
              <span id="userName" class="user-name">載入中...</span>
            </div>
          </div>
        </div>

        <!-- Weather & Location Strip -->
        <div class="status-strip">
          <div class="location-box">
            <span class="loc-icon">📍</span>
            <div class="loc-details">
              <span id="locAddress" class="loc-name">台北車站 (預設位置)</span>
              <span id="locCoords" class="loc-coords">25.0478° N, 121.5170° E</span>
            </div>
          </div>
          <div id="weatherPill" class="weather-pill">
            <span id="weatherIcon">🌤️</span>
            <span id="weatherText">--°C / 降雨 --%</span>
          </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
          <button id="locateBtn" class="btn btn-primary" title="取得目前位置">
            <span class="btn-icon">🎯</span>
            <span class="btn-text">分享目前位置</span>
          </button>
          <button id="refreshBtn" class="btn btn-secondary" title="重新整理資訊">
            <span class="btn-icon">🔄</span>
            <span class="btn-text">即時更新</span>
          </button>
          <span id="updateTimeText" class="update-time">最後更新：尚未載入</span>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Smart Advice Banner -->
        <section id="adviceSection" class="advice-card advice-general">
          <div class="advice-header">
            <span id="adviceIcon" class="advice-badge-icon">💡</span>
            <h2 id="adviceTitle" class="advice-title">智慧出行建議</h2>
            <span id="adviceTypeBadge" class="badge badge-light">即時推薦</span>
          </div>
          <p id="adviceSummary" class="advice-summary">正在取得周邊交通與天候即時資訊...</p>
          <p id="adviceDetail" class="advice-detail"></p>
        </section>

        <!-- Map Container -->
        <section class="map-section">
          <div class="map-header">
            <span class="section-title">🗺️ 周邊設施即時地圖</span>
            <span class="map-tip">可拖曳或點選地標圖示導航</span>
          </div>
          <div id="mapContainer" class="map-wrapper">
            <div id="map"></div>
            <div id="mapLoader" class="map-loader">
              <div class="spinner"></div>
              <span>載入地圖中...</span>
            </div>
            <!-- Floating Map Controls -->
            <div class="floating-controls">
              <button id="centerMeBtn" class="float-btn" title="回到定位中心">📍</button>
            </div>
          </div>
        </section>

        <!-- Segmented Filter Tabs -->
        <section class="filter-section">
          <div class="tabs-segmented">
            <button class="tab-btn active" data-filter="all">
              <span>全部清單</span>
              <span id="countAll" class="tab-count">0</span>
            </button>
            <button class="tab-btn" data-filter="bike">
              <span>🚲 YouBike</span>
              <span id="countBike" class="tab-count">0</span>
            </button>
            <button class="tab-btn" data-filter="parking">
              <span>🅿 停車場</span>
              <span id="countParking" class="tab-count">0</span>
            </button>
            <button class="tab-btn" data-filter="bus">
              <span>🚌 公車</span>
              <span id="countBus" class="tab-count">0</span>
            </button>
        </section>

        <!-- Transport Lists -->
        <section class="list-section">
          <!-- Loading Skeleton -->
          <div id="listLoader" class="skeleton-list">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="empty-state" style="display: none;">
            <span class="empty-icon">🔍</span>
            <p class="empty-title">方圓 1 公里內查無設施</p>
            <p class="empty-desc">請點擊上方「分享目前位置」重新取得定位，或擴大搜尋範圍。</p>
          </div>

          <!-- Cards Grid -->
          <div id="cardsGrid" class="cards-grid"></div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="app-footer">
        <p>資料來源：交通部 TDX 運輸資料流通服務 • 中央氣象署 CWA</p>
        <p class="footer-meta">LINE Mini App • motc-mini-dog</p>
      </footer>
    </div>

    <!-- Script Entrypoint -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
